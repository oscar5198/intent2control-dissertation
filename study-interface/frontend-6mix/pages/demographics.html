<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demographic Questionnaire | Intent2Control Listening Study</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css?v=audio-control-polish-20260731">
  <link rel="stylesheet" href="../css/pages.css?v=questionnaire-order-other-20260802">
</head>
<body data-page="demographics">
  <main id="app" class="app-shell app-shell--wide" data-page-container>
    <header class="study-brand" aria-label="Study branding">
      <a class="brand-mark" href="index.html" aria-label="Study home">
        <img class="brand-logo" src="../assets/images/qmul-logo.png" alt="Queen Mary University of London">
      </a>
      <div class="progress" data-progress aria-label="Study progress"></div>
    </header>

    <section class="main-card" aria-labelledby="page-title">
      <div class="page-header">
        <h1 id="page-title" class="page-title">Demographic Questionnaire</h1>
        <p class="page-intro">Please answer the following anonymous demographic questions. Required and optional questions are labelled.</p>
      </div>

      <form data-form="demographics" novalidate>
        <div class="validation-summary is-hidden" data-validation-summary tabindex="-1" aria-live="assertive">
          Please complete the required demographic questions before continuing.
        </div>

        <div class="questionnaire-list" data-questionnaire-fields="demographic"></div>

        <nav class="navigation-area" aria-label="Page navigation">
          <button class="button button--secondary" type="button" data-action="back" data-target="post-task.html">Back</button>
          <button class="button button--primary" type="submit">Continue to review</button>
        </nav>
      </form>
    </section>
  </main>
  <script src="../js/storage.js" defer></script>
  <script src="../js/timing.js" defer></script>
  <script src="../js/navigation.js?v=questionnaire-flow-20260802" defer></script>
  <script src="../js/validation.js" defer></script>
  <script src="../js/progress.js?v=questionnaire-flow-20260802" defer></script>
  <script src="../js/app.js?v=questionnaire-flow-20260802" defer></script>
</body>
</html>
