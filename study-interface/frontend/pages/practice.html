<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Trial | Intent2Control Listening Study</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-page="practice">
  <main id="app" class="app-shell app-shell--wide" data-page-container>
    <header class="study-brand" aria-label="Study branding">
      <a class="brand-mark" href="index.html" aria-label="Study home">
        <img class="brand-logo" src="../assets/images/qmul-logo.png" alt="Queen Mary University of London">
      </a>
      <div class="progress" data-progress aria-label="Study progress"></div>
    </header>

    <section class="main-card" aria-labelledby="page-title">
      <div class="page-header">
        <h1 id="page-title" class="page-title">Practice Trial</h1>
        <p class="page-intro">Your responses on this page will not be included in the main analysis.</p>
      </div>

      <form data-form="practice" novalidate>
        <div class="validation-summary is-hidden" data-validation-summary tabindex="-1">
          Please complete all required practice ratings and comments before continuing.
        </div>

        <div class="banner banner--warning" data-practice-development-notice>
          Practice trial
        </div>

        <section class="section-panel practice-context" aria-labelledby="practice-scenario-heading">
          <p class="field-help">Scenario</p>
          <h2 id="practice-scenario-heading" data-practice-scenario-title>Loading practice scenario...</h2>
          <p data-practice-scenario-text></p>
          <p class="field-help">Music excerpt</p>
          <p data-practice-excerpt-title></p>
        </section>

        <section class="practice-version-grid" data-practice-versions aria-label="Practice versions"></section>

        <nav class="navigation-area" aria-label="Page navigation">
          <button class="button button--secondary" type="button" data-action="back" data-target="instructions.html">Back</button>
          <button class="button button--primary" type="submit" data-practice-complete disabled>Complete practice</button>
        </nav>
      </form>
    </section>
  </main>
  <script src="../js/storage.js" defer></script>
  <script src="../js/timing.js" defer></script>
  <script src="../js/navigation.js" defer></script>
  <script src="../js/validation.js" defer></script>
  <script src="../js/audio.js" defer></script>
  <script src="../js/progress.js" defer></script>
  <script src="../js/trial.js" defer></script>
  <script src="../js/app.js" defer></script>
</body>
</html>
